name: Build desktop
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: daliad-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --mac dmg --x64 --arm64 --publish never
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ github.run_number }}
          files: daliad-desktop/dist/*.dmg
